
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100%"
  height="150"
  viewBox="0 0 600 150"
  fill="none"
>
  <foreignObject x="0" y="0" width="600" height="150">
    <div xmlns="http://www.w3.org/1999/xhtml"
         style="width:100%; height:100%;">
      <style>
        * {
          box-sizing: border-box;
        }

        .wrapper {
          width: 100%;
          height: 100%;
          display: flex;
          justify-content: center;
          align-items: center;
        }

        .text {
          font-family: monospace;
          font-size: 4em;
          white-space: nowrap;
          overflow: hidden;
          width: 13ch;
          border-right: 3px solid #fe00ff;

          background: linear-gradient(
            90deg,
            #00f1dc 0%,
            #5673f1 44%,
            #6744f1 54%,
            #fe00ff 100%
          );

          -webkit-background-clip: text;
          background-clip: text;
          -webkit-text-fill-color: transparent;

          animation:
            typing 1.5s steps(13, end),
            blink 0.5s step-end infinite alternate;
        }

        @keyframes typing {
          from {
            width: 0;
          }
          to {
            width: 13ch;
          }
        }

        @keyframes blink {
          from, to {
            border-color: transparent;
          }
          50% {
            border-color: #fe00ff;
          }
        }
      </style>

      <div class="wrapper">
        <div class="text">I LOVE Coding</div>
      </div>
    </div>
  </foreignObject>
</svg>
